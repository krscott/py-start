name: Test init-template script

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  init-template:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Configure Git identity
      run: |
        git config user.name "Template test"
        git config user.email "template-test@example.com"

    - name: Check init-template.sh
      run: |
        initial_commit=$(git rev-parse HEAD)
        ./init-template.sh my-test_app
        test -z "$(git status --porcelain)"
        commits=$(git log --format=%s "$initial_commit..HEAD")
        if [ "$commits" = "Init template" ]; then
          echo "No flake update commit was needed."
        else
          test "$commits" = "$(printf 'Update flake inputs\nInit template')"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "flake.lock"
        fi

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Test generated Nix package and renamed CLI
      run: nix flake check -L
