[project]
name = "py-start"
version = "0.1.0"
requires-python = ">=3.10.12"

dependencies = [
    "python-dotenv~=1.0",
    "setproctitle~=1.3",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy~=1.9",
    "pytest",
]

[project.scripts]
pystart = "py_start.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
skip = [".direnv", "result", ".venv"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
exclude = ["tests", "tests/**", ".direnv"]

[tool.mypy]
strict = true
exclude = ["tests"]

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

# [[tool.mypy.overrides]]
# module = ["example"]
# ignore_missing_imports = true

[tool.setuptools.packages.find]
exclude = ["result*"]

