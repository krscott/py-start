[project]
name = "py-start"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv~=1.2",
    "setproctitle~=1.3",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
]

[project.scripts]
pystart = "py_start.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["py_start"]

[tool.setuptools.package-data]
"py_start" = ["py.typed"]

[tool.isort]
profile = "black"
skip = [".direnv", "result", ".venv"]

[tool.black]
target-version = ["py312"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
exclude = [".direnv", "result", ".venv"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [".direnv", "result", ".venv"]

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

[tool.pytest.ini_options]
markers = [
    "integration: black-box integration tests that require installed executables",
]

