[project]
name = "py-start"
version = "0.1.0"
requires-python = ">=3.10.12"

dependencies = [
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy~=1.9",
    "pytest",
]

[project.scripts]
pystart = "py_start.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.isort]
skip = [".direnv", "result"]

